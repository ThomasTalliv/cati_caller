[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cati-caller"
version = "0.1.0"
description = "AI-driven CATI survey caller with open-source voice and telephony"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    # Redis / Celery
    "redis[asyncio]>=5.0.0",
    "celery[redis]>=5.4.0",
    # LLM
    "anthropic>=0.30.0",
    "openai>=1.35.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-openai>=0.2.0",
    # Export
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "gspread>=6.1.0",
    "google-auth>=2.30.0",
    # Utils
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "cel-python>=0.1.5",
]

[project.optional-dependencies]
telephony = [
    "signalwire-agents>=1.0.0",
]
tts = [
    "kokoro>=0.9.0",
    "soundfile>=0.12.0",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
]
stt = [
    "faster-whisper>=1.0.0",
    "silero-vad>=5.1.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "coverage>=7.5.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cati", "config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
