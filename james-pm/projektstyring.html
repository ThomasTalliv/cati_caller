<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projektstyring</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
    }
    h1 { font-size: 1.8rem; font-weight: 700; }
    p { color: #94a3b8; font-size: 0.95rem; }
    .btn {
      display: inline-block;
      background: #6366f1;
      color: #fff;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .btn:hover { background: #4f46e5; }
    .status {
      font-size: 0.85rem;
      color: #64748b;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f43f5e;
      margin-right: 6px;
      vertical-align: middle;
    }
    .dot.online { background: #10b981; }
    code {
      background: #1e293b;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <h1>James PM</h1>
  <p>Projektstyringsværktøj — klik for at åbne</p>
  <a class="btn" href="http://localhost:8000" target="_blank">Åbn projektstyring</a>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="status-text">Tjekker server…</span>
  </div>
  <p>Hvis serveren ikke kører: <code>python3 main.py</code></p>

  <script>
    async function checkServer() {
      try {
        const res = await fetch('http://localhost:8000/', { method: 'HEAD', mode: 'no-cors' });
        document.getElementById('dot').classList.add('online');
        document.getElementById('status-text').textContent = 'Server kører på localhost:8000';
      } catch {
        document.getElementById('status-text').textContent = 'Server ikke fundet — start den først';
      }
    }
    checkServer();
  </script>
</body>
</html>
